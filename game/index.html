<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR BAY — an original open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #101820;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(160deg, #1d2b3a 0%, #101820 60%, #241a12 100%);
  }
  canvas {
    width: 1280px;
    height: 800px;
    max-width: 100vw;
    max-height: 100vh;
    background: #7fae62;
    box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    border-radius: 6px;
    image-rendering: auto;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
