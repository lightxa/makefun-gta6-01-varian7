<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — an open-world crime game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a101c;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }
  #fallback {
    display: none;
    color: #ffffff;
    padding: 40px;
    font-size: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fallback">Solmar Bay needs JavaScript and a modern desktop browser to play.</div>
<script>
  if (!window.requestAnimationFrame) {
    document.getElementById('fallback').style.display = 'block';
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
